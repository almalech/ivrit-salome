<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f42c1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Salomé 💜"><title>Ivrit avec Salomé 💜</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23703ACF'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='34'%3E💜%3C/text%3E%3C/svg%3E"><style>:root{--ink:#38265c;--muted:#6d5a95;--accent:#7a46dd;--line:#eadfff;--ok:#e8f7ee;--bad:#fff0f3;--gold:#ffe08a;--silver:#e5e8ef;--bronze:#efc4a2;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f1ff,#efe4ff);color:var(--ink)}header{background:linear-gradient(135deg,#6f42c1,#9b71ff);color:#fff;padding:24px 18px 26px;border-radius:0 0 26px 26px;box-shadow:0 8px 18px rgba(111,66,193,.18)}header h1{margin:0;font-size:27px}header p{margin:7px 0 0;color:#f3edff}.wrap{max-width:760px;margin:auto;padding:0 14px 36px}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0;position:sticky;top:0;background:linear-gradient(180deg,#f7f1ff 75%, rgba(247,241,255,.9));z-index:5}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:14px;padding:10px 12px;font-weight:700}.tabs button.active{background:#efe4ff;border-color:#c8adff}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 14px rgba(111,66,193,.08)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#866bc4;font-weight:800}.title{font-size:22px;font-weight:800;margin:8px 0 6px}.muted{color:var(--muted);line-height:1.55}.btn{border:0;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff}.btn.secondary{background:#efe4ff;color:var(--accent)}.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}.he{direction:rtl;text-align:right;font-size:30px;font-weight:800;line-height:1.6}.phon{color:#7a46dd;font-style:italic}.fr{font-size:18px;font-weight:700}.pill{display:inline-block;background:#f2ebff;color:#6940bb;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;margin-right:6px;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #d9c8ff;border-radius:12px;font-size:16px;background:#fff}textarea{min-height:90px}.notice{background:#fff8e7;border:1px solid #f2dfab;color:#7c6634;padding:12px;border-radius:12px;font-size:14px}.success{background:var(--ok);border:1px solid #bfe4cc;color:#2b6c43;padding:12px;border-radius:12px}.error{background:var(--bad);border:1px solid #f4c3cf;color:#9f3755;padding:12px;border-radius:12px}.option{width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid #decfff;background:#fff;color:var(--ink);font-size:16px;font-weight:700;margin-bottom:10px}.option:hover{border-color:#b893ff;background:#faf7ff}.center{text-align:center}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}footer{color:#866bc4;text-align:center;padding:20px 10px 34px;font-size:13px}.gym{padding:16px;border-radius:20px;background:linear-gradient(180deg,#fcfaff,#f2e9ff);border:1px solid #eadfff;min-height:250px;position:relative;overflow:hidden}.sky{height:55px;background:linear-gradient(180deg,#d3c0ff,#f2e9ff);border-radius:16px 16px 0 0;position:relative}.floor{height:42px;background:linear-gradient(180deg,#d8b1ff,#b274ff);border-radius:0 0 16px 16px;margin-top:8px}.beam{height:12px;background:#b06dff;border-radius:8px;position:absolute;left:18px;right:18px;bottom:66px}.vault{width:90px;height:40px;background:#cfb4ff;border-radius:55px 55px 16px 16px;position:absolute;right:26px;bottom:66px;border-bottom:6px solid #9d67e2}.bars .bar1,.bars .bar2{position:absolute;width:6px;background:#a46af0;bottom:70px;border-radius:99px}.bars .bar1{height:110px;left:34%}.bars .bar2{height:140px;left:56%}.bars .line1,.bars .line2{position:absolute;height:6px;background:#d8b8ff;border-radius:99px;left:34%;right:33%}.bars .line1{bottom:175px}.bars .line2{bottom:145px}.girl{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;font-size:74px;transition:all .45s ease}.girl.small{font-size:62px}.girl.fall{transform:translateX(-50%) rotate(90deg);bottom:58px;opacity:.9}.girl.beamok{bottom:92px}.girl.vaultok{right:70px;left:auto;transform:rotate(-18deg)}.girl.barsok{bottom:150px}.girl.floorok{bottom:76px;transform:translateX(-50%) rotate(-18deg)}.scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:14px}.kpi{background:#faf7ff;border:1px solid #eadfff;border-radius:16px;padding:10px}.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:18px}.step{width:30%;max-width:150px;border-radius:16px 16px 0 0;padding:12px 8px;text-align:center;font-weight:800}.first{background:var(--gold);height:160px}.second{background:var(--silver);height:130px}.third{background:var(--bronze);height:110px}.badge{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#fff;margin-bottom:8px;font-size:18px}.list{display:flex;flex-direction:column;gap:10px}.small{font-size:13px;color:var(--muted)}
/* Jeu de gymnastique animé · version 2 */
.gym-stage{position:relative;height:250px;overflow:hidden;background:linear-gradient(180deg,#eadcff 0%,#fcf8ff 68%,#f1dcff 100%);border:2px solid #ddc6ff;border-radius:20px;margin:16px 0 12px;isolation:isolate}
.gym-stage:before{content:"✦      ✧              ✦";position:absolute;top:12px;left:0;right:0;text-align:center;color:#ae8df1;letter-spacing:18px;font-size:23px}
.gym-stage .mat{position:absolute;bottom:18px;left:5%;right:5%;height:24px;background:#ba87f2;border-radius:60% 60% 8px 8px;box-shadow:0 9px 0 #9161d1}
.gym-stage .apparatus{position:absolute;inset:0;pointer-events:none}
.gym-stage .apparatus svg{width:100%;height:100%;display:block}
.gymnast{position:absolute;left:48%;bottom:38px;width:86px;height:148px;transform:translateX(-50%);transform-origin:50% 79%;z-index:2;filter:drop-shadow(1px 4px 3px #5334802e)}
.gymnast svg{width:100%;height:100%;overflow:visible}
.gymnast .arm-l,.gymnast .arm-r,.gymnast .leg-l,.gymnast .leg-r{transform-box:fill-box;transform-origin:center top}
.gymnast.success.figure-0{animation:salome-wheel 1.55s cubic-bezier(.45,.04,.57,.98) both}
.gymnast.success.figure-1{animation:salome-bars 1.55s ease-in-out both}
.gymnast.success.figure-2{animation:salome-vault 1.55s ease-in-out both}
.gymnast.success.figure-3{animation:salome-beam 1.55s ease-in-out both}
.gymnast.fail{animation:salome-fall 1.35s ease-in-out both}
.gymnast.success .arm-r{animation:salome-wave 1.5s ease-in-out}
.gym-stage.action{box-shadow:0 0 0 4px #d6f5e7 inset}
.gym-stage.action.failed{box-shadow:0 0 0 4px #ffd6df inset}
.gym-status{min-height:46px;margin:8px 0 10px;text-align:center;font-size:17px;font-weight:850;color:#5d38b3}
.gym-status.win{color:#1f8c58}.gym-status.lose{color:#aa3b63}
.gym-actions button:disabled{opacity:.5;cursor:wait}
.gym-podium{margin-top:18px}.gym-podium .step{min-height:112px;height:auto!important;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.gym-podium .step.first{min-height:175px}.gym-podium .step.second{min-height:140px}.gym-podium .step.third{min-height:110px}
@keyframes salome-wheel{0%{transform:translateX(-50%) rotate(0deg)}18%{transform:translateX(-72%) translateY(-6px) rotate(-55deg)}45%{transform:translateX(-35%) translateY(-22px) rotate(-170deg)}75%{transform:translateX(0%) translateY(-5px) rotate(-300deg)}100%{transform:translateX(10%) rotate(-360deg)}}
@keyframes salome-bars{0%{transform:translateX(-50%) translateY(0) rotate(0deg)}22%{transform:translateX(-50%) translateY(-29px) rotate(-50deg)}50%{transform:translateX(-50%) translateY(-48px) rotate(-190deg)}77%{transform:translateX(-10%) translateY(-22px) rotate(-330deg)}100%{transform:translateX(48%) translateY(0) rotate(-360deg)}}
@keyframes salome-vault{0%{transform:translateX(-160%) translateY(0) rotate(0deg)}28%{transform:translateX(-75%) translateY(-12px) rotate(-5deg)}48%{transform:translateX(20%) translateY(-96px) rotate(-130deg)}73%{transform:translateX(85%) translateY(-78px) rotate(-300deg)}100%{transform:translateX(155%) translateY(0) rotate(-360deg)}}
@keyframes salome-beam{0%{transform:translateX(-50%) translateY(0) rotate(0deg)}20%{transform:translateX(-50%) translateY(-18px) rotate(-9deg)}42%{transform:translateX(-50%) translateY(-46px) rotate(18deg)}60%{transform:translateX(-50%) translateY(-42px) rotate(-15deg)}83%{transform:translateX(-50%) translateY(-5px) rotate(7deg)}100%{transform:translateX(-50%) translateY(0) rotate(0deg)}}
@keyframes salome-fall{0%{transform:translateX(-50%) rotate(0deg)}30%{transform:translateX(-50%) translateY(-25px) rotate(-25deg)}70%{transform:translateX(-30%) translateY(16px) rotate(73deg)}100%{transform:translateX(0%) translateY(24px) rotate(92deg)}}
@keyframes salome-wave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-45deg)}}
@media(prefers-reduced-motion:reduce){.gymnast.success,.gymnast.fail{animation-duration:.7s}}

/* Salomé V3 : vraie roue en dessin vectoriel articulé, sans carte ni photo */
.gym-stage{height:295px;background:linear-gradient(#f9f3ff 0%,#fff 77%,#efe1ff 77%);border:0;border-radius:22px;overflow:hidden}
.gym-stage:before{content:"";display:none}.gym-stage .mat{bottom:21px;height:14px;left:4%;right:4%;background:#aa76e6;box-shadow:0 7px 0 #814dbf}
.gymnast{width:98px;height:168px;bottom:39px;left:28%;transform:translateX(-50%);transform-origin:50% 72%;filter:drop-shadow(0 3px 2px #6d47ac26)}
.gymnast svg{height:100%;width:100%}.gymnast.success.figure-0,.gymnast.success.figure-1,.gymnast.success.figure-2,.gymnast.success.figure-3{animation:real-cartwheel 1.75s ease-in-out both}
.gymnast.fail{animation:real-fall 1.75s ease-in-out both}
.gymnast.success .leg-l{animation:split-left 1.75s both;transform-origin:40px 103px;transform-box:view-box}
.gymnast.success .leg-r{animation:split-right 1.75s both;transform-origin:52px 103px;transform-box:view-box}
.gymnast.success .arm-l{animation:arms-open-l 1.75s both;transform-origin:34px 63px;transform-box:view-box}
.gymnast.success .arm-r{animation:arms-open-r 1.75s both;transform-origin:58px 63px;transform-box:view-box}
.gymnast.fail .leg-l{animation:stumble 1.75s both;transform-origin:40px 103px;transform-box:view-box}
.gymnast.fail .arm-r{animation:stumble 1.75s both;transform-origin:58px 63px;transform-box:view-box}
@keyframes real-cartwheel{0%,8%{left:28%;transform:translateX(-50%) rotate(0)}25%{left:39%;transform:translateX(-50%) rotate(-70deg)}49%{left:51%;transform:translateX(-50%) translateY(-9px) rotate(-178deg)}73%{left:64%;transform:translateX(-50%) rotate(-280deg)}92%,100%{left:74%;transform:translateX(-50%) rotate(-360deg)}}
@keyframes real-fall{0%,14%{left:28%;transform:translateX(-50%) rotate(0)}34%{left:36%;transform:translateX(-50%) rotate(-28deg)}57%{left:43%;transform:translateX(-50%) translateY(-11px) rotate(-68deg)}85%,100%{left:51%;transform:translateX(-50%) translateY(44px) rotate(-88deg)}}
@keyframes split-left{0%,8%,95%,100%{transform:rotate(0)}27%,68%{transform:rotate(-45deg)}50%{transform:rotate(-62deg)}}
@keyframes split-right{0%,8%,95%,100%{transform:rotate(0)}27%,68%{transform:rotate(43deg)}50%{transform:rotate(59deg)}}
@keyframes arms-open-l{0%,8%,95%,100%{transform:rotate(0)}30%,75%{transform:rotate(-33deg)}}
@keyframes arms-open-r{0%,8%,95%,100%{transform:rotate(0)}30%,75%{transform:rotate(32deg)}}
@keyframes stumble{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(45deg)}}
.gym-stage .apparatus{display:none}.gym-stage .gym-caption{position:absolute;bottom:5px;right:20px;z-index:3;color:#6940a0;font-size:11px;font-weight:800}
/* Deux nouveaux jeux */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.match-col{display:flex;flex-direction:column;gap:8px}
.match-option{padding:13px 6px;min-height:56px;border-radius:13px;border:1px solid #d8c1fd;background:white;color:var(--ink);font-weight:750;font-size:15px;overflow-wrap:anywhere}
.match-option.he-choice{font-size:22px;direction:rtl}.match-option.selected{border:3px solid #8652de;background:#f0e7ff}
.match-option.matched{background:#e2f5e6;border-color:#83cc9d;color:#2f7448}
.quiz-stat{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}

/* Salomé v4 : belles illustrations statiques, sans carte ni fausse animation */
.gym-art{height:320px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:14px auto 6px;background:transparent;border:0;border-radius:0;position:relative}
.gym-illustration{max-height:310px;max-width:100%;width:auto;height:auto;object-fit:contain;display:block;filter:drop-shadow(0 6px 9px rgba(92,48,130,.1))}
.gym-ready{display:flex;align-items:center;justify-content:center;gap:10px;flex-direction:column;text-align:center;color:#7745bd;font-size:16px}
.gym-ready span{font-size:13px;color:#856eab}.gym-ready-icon{font-size:54px}
.gym-missed{font-size:48px;color:#a84c77;text-align:center;font-weight:900;line-height:1.3}
.gym-missed div{font-size:26px}.gym-missed small{display:block;font-size:14px;font-weight:600}
.gym-art.reveal .gym-illustration{animation:appear-soft .28s ease-out both}
@keyframes appear-soft{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
@media(max-width:380px){.gym-art{height:265px}.gym-illustration{max-height:260px}}

const GYM_ART_NAMES=["La roue", "Le grand écart", "L’équilibre", "La poutre", "Les barres", "Le saut de cheval"];
const GYM_FIGURES=GYM_ART_NAMES;
const GYM_ROUNDS=10;
let gymBusy=false;
let gymTimer=null;
function ensureGym(){
 const g=state.gym;
 if(g.round===undefined)g.round=0;
 if(g.score===undefined)g.score=0;
 if(g.errors===undefined)g.errors=0;
 if(!Array.isArray(g.history))g.history=[];
 if(g.apparatus===undefined)g.apparatus=0;
 if(!Array.isArray(g.opponents))g.opponents=[6+Math.floor(Math.random()*3),5+Math.floor(Math.random()*4)];
 if(!Array.isArray(g.deck))g.deck=shuffle(WORDS.map((_,i)=>i));
 if(!g.current||!WORDS.some(w=>w.he===g.current.he))g.current=WORDS[g.deck[g.round%g.deck.length]];
 if(!Array.isArray(g.choices))g.choices=shuffle([g.current.fr,...shuffle(WORDS.map(w=>w.fr).filter(fr=>fr!==g.current.fr)).slice(0,3)]);
 save();
}
function resetGym(){
 if(gymTimer)clearTimeout(gymTimer);gymBusy=false;
 state.gym={round:0,score:0,errors:0,apparatus:0,done:false,history:[],opponents:[6+Math.floor(Math.random()*3),5+Math.floor(Math.random()*4)],deck:shuffle(WORDS.map((_,i)=>i)),current:null,choices:null};
 ensureGym();save();render();
}
function podiumData(){
 const g=state.gym;
 const arr=[{name:'Salomé',score:g.score,emoji:'💜'},{name:'Nina',score:g.opponents[0],emoji:'🩷'},{name:'Emma',score:g.opponents[1],emoji:'🤍'}];
 arr.sort((a,b)=>b.score-a.score||(a.name==='Salomé'?-1:b.name==='Salomé'?1:a.name.localeCompare(b.name)));
 return arr;
}
function advanceGym(){
 gymTimer=null;gymBusy=false;
 const g=state.gym;g.round++;g.apparatus=g.round%4;g.current=null;g.choices=null;
 if(g.round>=GYM_ROUNDS)g.done=true;else ensureGym();
 save();if(state.tab==='gym')render();
}
function gymArtIndex(g){
 const wins=(g.history||[]).filter(h=>h.ok).length;

function gmMakeQuestions(level,type){let pool=shuffle(gmPool(level)),count=Math.min(9,level<=5?4:level<=10?5:level<=15?6:7),set=pool.slice(0,count);return set.map((w,i)=>{let mode=type==='Grand défi'?['Traduction','Écriture','Complète','Rapidité'][i%4]:type;let rev=(i%2===0),answer=mode==='Écriture'?w.he:mode==='Complète'?w.female:rev?w.fr:w.he;let all=mode==='Complète'?pool.map(z=>z.female):rev?pool.map(z=>z.fr):pool.map(z=>z.he);let options=shuffle([answer,...shuffle([...new Set(all.filter(a=>a!==answer))]).slice(0,3)]);return {w,mode,rev,answer,options}})}

function gmPairsHtml(){let r=gmRun,p=r.pairs;return `<p class="muted">${r.type==='Memory'?'Retourne deux cartes pour retrouver hébreu et français.':'Associe chaque mot à sa traduction.'}</p><div class="gm-progress"><span style="width:${p.found.length/p.chosen.length*100}%"></span></div><p><b>${p.found.length}/${p.chosen.length} paires</b> · ${r.errors} erreur(s)</p><div class="${r.type==='Memory'?'gm-tiles':'gm-pairs'}">${p.board.map((t,i)=>{let matched=p.found.includes(t.id),open=r.type==='Paires'||matched||p.open.includes(i);return `<button class="${r.type==='Memory'?'gm-tile':'gm-opt'} ${matched?'matched':''} ${!open?'hidden':''} ${p.first===i?'sel':''}" onclick="gmPairClick(${i})" ${matched?'disabled':''}>${open?t.text:'✦'}</button>`}).join('')}</div>`}
function gmFinish(){let r=gmRun;if(!r||r.finished)return;gmClear();r.finished=true;let total=(r.type==='Paires'||r.type==='Memory')?r.pairs.chosen.length:r.items.length;let pct=Math.round(100*r.correct/total);r.won=pct>=70;let earned=r.won?(pct===100?3:pct>=85?2:1):0;r.earned=earned;if(r.won){gmState.stars[r.level]=Math.max(gmState.stars[r.level]||0,earned);if(r.level===gmState.unlocked)gmState.unlocked=Math.min(21,r.level+1);gmSave()}gmRender()}
function gmGame(){let r=gmRun,level=r.level;if(r.finished)return `<section class="gm-card center"><div style="font-size:58px">${r.won?'🏆':'🎀'}</div><h2>${r.won?'Bravo Salomé !':'On réessaie !'}</h2><p><b>${r.correct}</b> bonnes réponses · <b>${r.errors}</b> erreurs</p><div style="font-size:30px">${'⭐'.repeat(r.earned||0)}${'☆'.repeat(3-(r.earned||0))}</div><p class="muted">${r.won?'Niveau débloqué ! Continue ton aventure.':'Pour gagner, il faut au moins 70 % de réussite. Tu peux le refaire.'}</p><div class="row" style="justify-content:center"><button class="btn secondary" onclick="gmStop()">Voir le parcours</button><button class="btn" onclick="gmStart(${r.won?Math.min(20,level+1):level})">${r.won&&level<20?'Niveau suivant →':'Rejouer'}</button></div></section>`;let paired=r.type==='Paires'||r.type==='Memory';let q=r.items[r.index];return `<section class="gm-card"><div class="gm-game-head"><button class="btn secondary" onclick="gmStop()">← Parcours</button><span class="pill">Niveau ${level}/20 · ${r.type}</span></div><h2>🤸‍♀️ ${r.type}</h2><div class="between"><span>✅ ${r.correct} bonne(s) réponse(s)</span>${r.type==='Rapidité'||r.type==='Grand défi'?`<span>⏱ <b id="gm-clock">${Math.max(0,r.seconds-Math.floor((Date.now()-r.start)/1000))}</b>s</span>`:''}</div><div class="gm-progress"><span style="width:${(paired?r.pairs.found.length/r.pairs.chosen.length:r.index/r.items.length)*100}%"></span></div>${paired?gmPairsHtml():gmQuestionHtml(q)}${r.locked&&!paired?`<div class="gm-feedback">${r.feedback}</div><button class="btn" style="margin-top:12px" onclick="gmNext()">${r.index===r.items.length-1?'Voir le résultat':'Question suivante →'}</button>`:''}</section>`}
// L'aventure devient la première page, sans modifier la mémoire des jeux existants.
tabs.unshift(['adventure','🌟 Mon aventure']);
const salomeOriginalRender=render;
render=function(){if(state.tab==='adventure'){renderTabs();$('#app').innerHTML=gmView()}else salomeOriginalRender()};
state.tab='adventure';save();

render();
</script></body></html>
