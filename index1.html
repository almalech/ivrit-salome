/* Jeu de gymnastique animé · version 2 */
.gym-stage{position:relative;height:250px;overflow:hidden;background:linear-gradient(180deg,#eadcff 0%,#fcf8ff 68%,#f1dcff 100%);border:2px solid #ddc6ff;border-radius:20px;margin:16px 0 12px;isolation:isolate}

.gymnast{position:absolute;left:48%;bottom:38px;width:86px;height:148px;transform:translateX(-50%);transform-origin:50% 79%;z-index:2;filter:drop-shadow(1px 4px 3px #5334802e)}
.gymnast svg{width:100%;height:100%;overflow:visible}

.gymnast.success.figure-1{animation:salome-bars 1.55s ease-in-out both}

const GYM_ART_NAMES=["La roue", "Le grand écart", "L’équilibre", "La poutre", "Les barres", "Le saut de cheval"];
const GYM_FIGURES=GYM_ART_NAMES;
const GYM_ROUNDS=10;
let gymBusy=false;
let gymTimer=null;
function ensureGym(){
 const g=state.gym;
 if(g.round===undefined)g.round=0;
 if(g.score===undefined)g.score=0;
 if(g.errors===undefined)g.errors=0;
 if(!Array.isArray(g.history))g.history=[];
 if(g.apparatus===undefined)g.apparatus=0;
 if(!Array.isArray(g.opponents))g.opponents=[6+Math.floor(Math.random()*3),5+Math.floor(Math.random()*4)];
 if(!Array.isArray(g.deck))g.deck=shuffle(WORDS.map((_,i)=>i));
 if(!g.current||!WORDS.some(w=>w.he===g.current.he))g.current=WORDS[g.deck[g.round%g.deck.length]];
 if(!Array.isArray(g.choices))g.choices=shuffle([g.current.fr,...shuffle(WORDS.map(w=>w.fr).filter(fr=>fr!==g.current.fr)).slice(0,3)]);
 save();
}
function resetGym(){
 if(gymTimer)clearTimeout(gymTimer);gymBusy=false;
 state.gym={round:0,score:0,errors:0,apparatus:0,done:false,history:[],opponents:[6+Math.floor(Math.random()*3),5+Math.floor(Math.random()*4)],deck:shuffle(WORDS.map((_,i)=>i)),current:null,choices:null};
 ensureGym();save();render();
}
function podiumData(){
 const g=state.gym;
 const arr=[{name:'Salomé',score:g.score,emoji:'💜'},{name:'Nina',score:g.opponents[0],emoji:'🩷'},{name:'Emma',score:g.opponents[1],emoji:'🤍'}];
 arr.sort((a,b)=>b.score-a.score||(a.name==='Salomé'?-1:b.name==='Salomé'?1:a.name.localeCompare(b.name)));
 return arr;
}
function advanceGym(){
 gymTimer=null;gymBusy=false;
 const g=state.gym;g.round++;g.apparatus=g.round%4;g.current=null;g.choices=null;
 if(g.round>=GYM_ROUNDS)g.done=true;else ensureGym();
 save();if(state.tab==='gym')render();
}
function gymArtIndex(g){
 const wins=(g.history||[]).filter(h=>h.ok).length;
 return Math.max(0,(wins-1)%GYM_ART.length);
}
function gymFallIllustration(){return `<img class="gym-illustration" src="${GYM_FALL_ART}" alt="Gymnaste blonde en justaucorps violet allongée sur le tapis après une figure ratée" draggable="false">`}
function gymIllustration(i){return `<img class="gym-illustration" src="${GYM_ART[i]}" alt="Gymnaste en justaucorps violet : ${GYM_ART_NAMES[i]}" draggable="false">`}
function answerGym(i){
 if(gymBusy||state.gym.done)return;
 ensureGym();const g=state.gym,answer=g.choices[i];
 if(answer===undefined)return;
 gymBusy=true;const good=answer===g.current.fr;
 g.history.push({word:g.current.he,answer,ok:good});
 if(good)g.score++;else g.errors++;
 save();
 const art=$('#gym-art');const status=$('#gymstatus');
 if(art){
  if(good){const imageIndex=gymArtIndex(g);art.innerHTML=gymIllustration(imageIndex);art.classList.add('reveal')}
  else{art.innerHTML=gymFallIllustration();art.classList.add('missed')}
 }
 if(status){status.className='gym-status '+(good?'win':'lose');status.textContent=good?'BRAVO ! '+GYM_ART_NAMES[gymArtIndex(g)]+' réussie ! 💜':'Raté ! Réessaie à la prochaine question.'}
 document.querySelectorAll('.gym-actions button').forEach(b=>b.disabled=true);
 gymTimer=setTimeout(advanceGym,2400);
}
function gymView(){
 ensureGym();const g=state.gym;
 if(g.done){
  const p=podiumData(),medals=['🥇','🥈','🥉'],classes=['first','second','third'];
  return `<section class="card"><div class="eyebrow">Fin de la compétition</div><div class="title">🏆 Podium de gymnastique</div><p class="muted">Résultat après ${GYM_ROUNDS} questions. Chaque bonne réponse donne un point à Salomé.</p>
  <div class="scoreboard"><div class="kpi"><div class="small">Réussites</div><div class="title">${g.score}</div></div><div class="kpi"><div class="small">Erreurs</div><div class="title">${g.errors}</div></div><div class="kpi"><div class="small">Questions</div><div class="title">${GYM_ROUNDS}</div></div></div>
  <div class="podium gym-podium">${p.map((x,i)=>`<div class="step ${classes[i]}"><span class="badge">${medals[i]}</span><strong>${x.emoji} ${x.name}</strong><span>${x.score} pts</span></div>`).join('')}</div>
  <div class="center" style="margin-top:18px"><div class="title">${p[0].name==='Salomé'?'Championne ! 🎉':'Tu peux prendre ta revanche !'}</div><button class="btn" onclick="resetGym()">Nouvelle compétition 🤸‍♀️</button></div></section>`;
 }
 const last=g.history.filter(h=>h.ok).length;
 const failedLast=g.history.length>0 && !g.history[g.history.length-1].ok;
 const currentPicture=failedLast?gymFallIllustration():last?gymIllustration(gymArtIndex(g)):`<div class="gym-ready"><div class="gym-ready-icon">🏅</div><strong>Prête pour la première figure ?</strong><span>Une bonne réponse révèle une gymnaste !</span></div>`;
 return `<section class="card"><div class="eyebrow">Jeu gym · Compétition</div><div class="title">Défi des gymnastes 💜</div><p class="muted">À chaque bonne réponse, découvre une nouvelle figure : roue, grand écart, équilibre, poutre, barres et saut de cheval.</p>
 <div class="scoreboard"><div class="kpi"><div class="small">Question</div><div class="title">${g.round+1}/${GYM_ROUNDS}</div></div><div class="kpi"><div class="small">Réussites</div><div class="title">${g.score}</div></div><div class="kpi"><div class="small">Erreurs</div><div class="title">${g.errors}</div></div></div>
 <div id="gym-art" class="gym-art">${currentPicture}</div>
 <div id="gymstatus" class="gym-status">Choisis la bonne réponse pour découvrir la prochaine figure !</div>
 <div class="he">${g.current.he}</div><p class="muted center">Que signifie ce verbe ?</p>
 <div class="gym-actions">${g.choices.map((x,i)=>`<button class="option" onclick="answerGym(${i})">${x}</button>`).join('')}</div></section>`;
}
function currentRole(){return ROLEPLAYS[state.role.mission]}function submitRole(){const val=normalize($('#roleanswer').value),step=currentRole().steps[state.role.step],good=step.answers.map(normalize).includes(val),box=$('#rolefeedback');if(good){state.role.score++;box.className='success';box.textContent='Bravo ! Bonne réponse.';state.role.step++;$('#roleanswer').value='';if(state.role.step>=currentRole().steps.length)state.role.done=true;save();setTimeout(render,500)}else{box.className='error';box.innerHTML='Pas exactement. Réponse attendue : <b>'+step.answers[0]+'</b>';save()}}function nextMission(){state.role={mission:(state.role.mission+1)%ROLEPLAYS.length,step:0,score:0,done:false};save();render()}function resetRole(){state.role={mission:0,step:0,score:0,done:false};save();render()}function roleView(){const m=currentRole();if(state.role.done)return `<section class='card'><div class='eyebrow'>Mission terminée</div><div class='title'>${m.name}</div><div class='success'>Score : ${state.role.score}/${m.steps.length}</div><div class='row' style='margin-top:14px'><button class='btn' onclick='nextMission()'>Mission suivante</button><button class='btn ghost' onclick='resetRole()'>Recommencer</button></div></section>`;const step=m.steps[state.role.step];return `<section class='card'><div class='eyebrow'>Jeu de rôle écrit</div><div class='title'>${m.name}</div><p class='muted'>Lis la consigne en français, puis écris la réponse en hébreu.</p><div class='kpi'><div class='small'>Étape</div><div class='title'>${state.role.step+1}/${m.steps.length}</div></div><div class='card' style='background:#faf7ff;margin-top:14px'><div class='fr'>${step.fr}</div></div><label for='roleanswer'>Ta réponse en hébreu</label><textarea id='roleanswer' placeholder='Écris ici en hébreu'></textarea><div id='rolefeedback' style='margin-top:10px'></div><div class='row' style='margin-top:12px'><button class='btn' onclick='submitRole()'>Vérifier</button><button class='btn ghost' onclick="document.getElementById('rolefeedback').innerHTML='<div class=notice>Indice : pense à la forme féminine si besoin.</div>'">Indice</button></div></section>`}function submitFill(){const val=normalize($('#fillanswer').value),item=FILLS[state.fill.index],good=normalize(item.answer)===val,box=$('#fillfeedback');if(good){state.fill.score++;state.fill.index++;$('#fillanswer').value='';box.className='success';box.textContent='Bravo !';if(state.fill.index>=FILLS.length)state.fill.done=true;save();setTimeout(render,450)}else{box.className='error';box.innerHTML='Pas encore. Bonne réponse : <b>'+item.answer+'</b>';save()}}function resetFill(){state.fill={index:0,score:0,done:false};save();render()}function fillView(){if(state.fill.done)return `<section class='card'><div class='eyebrow'>Complète la phrase</div><div class='title'>Terminé !</div><div class='success'>Score : ${state.fill.score}/${FILLS.length}</div><div class='center' style='margin-top:14px'><button class='btn' onclick='resetFill()'>Recommencer</button></div></section>`;const item=FILLS[state.fill.index];return `<section class='card'><div class='eyebrow'>Complète la phrase</div><div class='title'>Trouve le bon mot</div><div class='small'>${state.fill.index+1}/${FILLS.length}</div><div class='he' style='margin-top:10px'>${item.text}</div><div class='muted'>${item.fr}</div><label for='fillanswer'>Ta réponse en hébreu</label><input id='fillanswer' placeholder='Écris le mot manquant'><div id='fillfeedback' style='margin-top:10px'></div><div class='row' style='margin-top:12px'><button class='btn' onclick='submitFill()'>Vérifier</button><button class='btn ghost' onclick="document.getElementById('fillfeedback').innerHTML='<div class=notice>Indice : <b>${item.answer}</b></div>'">Indice</button></div></section>`}function progressView(){const knownCount=Object.values(state.known).filter(Boolean).length;return `<section class='card'><div class='eyebrow'>Progression</div><div class='title'>Tes résultats</div><div class='scoreboard'><div class='kpi'><div class='small'>Verbes connus</div><div class='title'>${knownCount}/${WORDS.length}</div></div><div class='kpi'><div class='small'>Gym</div><div class='title'>${state.gym.score} réussites</div></div><div class='kpi'><div class='small'>Écriture</div><div class='title'>${state.role.score} points</div></div></div><div class='notice' style='margin-top:14px'>Quand tu coches “Je connais déjà”, les verbes reviennent moins souvent dans les jeux.</div><div class='center' style='margin-top:14px'><button class='btn ghost' onclick='localStorage.removeItem("salome_app_state"); location.reload();'>Réinitialiser l’application</button></div></section>`}
// Mini-jeu de traduction dans les deux sens, mots avec nékoudot.
let translation = null;
function startTranslation(){
 const w=pick(WORDS), reverse=Math.random()<.5;
 const answers=shuffle([w,...shuffle(WORDS.filter(x=>x.he!==w.he&&x.fr!==w.fr)).slice(0,3)]);
 translation={w,reverse,answers,selected:null,done:false,correct:0};render();
}
function selectTranslation(i){
 if(!translation||translation.done)return;
 translation.selected=i;translation.done=true;
 const ok=translation.answers[i].he===translation.w.he;
 if(ok){state.quizCorrect=(state.quizCorrect||0)+1}else{state.quizWrong=(state.quizWrong||0)+1}
 save();render();
}
function translationView(){
 if(!translation)return `<section class="card"><div class="eyebrow">Jeu des verbes</div><div class="title">Traduction dans les deux sens</div><p class="muted">Parfois tu lis l'hébreu et retrouves le français. Parfois c'est l'inverse !</p><button class="btn" onclick="startTranslation()">Commencer</button></section>`;
 const q=translation,ok=q.done&&q.answers[q.selected].he===q.w.he;
 return `<section class="card"><div class="eyebrow">${q.reverse?'Français → Hébreu':'Hébreu → Français'}</div>
 <div class="quiz-stat"><span class="pill">✓ ${state.quizCorrect||0} bonnes réponses</span><span class="pill">✗ ${state.quizWrong||0} erreurs</span></div>
 <div class="title">${q.reverse?'Comment dit-on ce verbe en hébreu ?':'Que signifie ce verbe ?'}</div>
 ${q.reverse?`<div class="title">${q.w.fr}</div>`:`<div class="he">${q.w.he}</div>`}
 ${q.answers.map((w,i)=>`<button class="option" ${q.done?'disabled':''} onclick="selectTranslation(${i})">${q.reverse?`<span dir="rtl" style="font-size:25px">${w.he}</span>`:w.fr}</button>`).join('')}
 ${q.done?`<div class="${ok?'success':'error'}"><b>${ok?'Bravo !':'À revoir'}</b><div>${q.w.fr} — <b dir="rtl">${q.w.he}</b></div><div class="phon">${q.w.ph}</div></div><div class="row" style="margin-top:14px"><button class="btn" onclick="startTranslation()">Question suivante</button></div>`:''}
 </section>`;
}
// Associations : 5 mots par manche, ordre des colonnes mélangé.
let matchGame=null;
function startMatch(){const chosen=shuffle(WORDS).slice(0,5);matchGame={chosen,left:shuffle(chosen),right:shuffle(chosen),leftPick:null,rightPick:null,found:[],mistakes:0,feedback:''};render()}
function chooseMatch(side,i){
 if(!matchGame)return;const m=matchGame,item=(side==='L'?m.left:m.right)[i];
 if(m.found.includes(item.he))return;
 if(side==='L')m.leftPick=i;else m.rightPick=i;
 if(m.leftPick!==null&&m.rightPick!==null){
 const a=m.left[m.leftPick],b=m.right[m.rightPick];
 if(a.he===b.he){m.found.push(a.he);m.feedback='Bonne association ! 💜'}
 else{m.mistakes++;m.feedback='Pas encore, essaie une autre paire.'}
 m.leftPick=null;m.rightPick=null;
 }
 render();
}
function matchingView(){
 if(!matchGame)return `<section class="card"><div class="eyebrow">Associations</div><div class="title">Relie les verbes</div><p class="muted">Retrouve 5 paires hébreu-français par manche. Les mots changent à chaque partie.</p><button class="btn" onclick="startMatch()">Jouer</button></section>`;
 const m=matchGame,all=m.found.length===m.chosen.length;
 return `<section class="card"><div class="eyebrow">Associations</div><div class="title">Relie les bonnes traductions</div>
 <div class="quiz-stat"><span class="pill">${m.found.length}/5 paires</span><span class="pill">${m.mistakes} erreur(s)</span></div>
 <div class="match-grid"><div class="match-col">${m.left.map((w,i)=>`<button ${m.found.includes(w.he)?'disabled':''} class="match-option he-choice ${m.leftPick===i?'selected':''} ${m.found.includes(w.he)?'matched':''}" onclick="chooseMatch('L',${i})">${w.he}</button>`).join('')}</div>
 <div class="match-col">${m.right.map((w,i)=>`<button ${m.found.includes(w.he)?'disabled':''} class="match-option ${m.rightPick===i?'selected':''} ${m.found.includes(w.he)?'matched':''}" onclick="chooseMatch('R',${i})">${w.fr}</button>`).join('')}</div></div>
 <p class="muted">${all?'Bravo, les 5 paires sont trouvées !':m.feedback}</p>
 <button class="btn ${all?'':'secondary'}" onclick="startMatch()">${all?'Nouvelle manche':'Changer de série'}</button></section>`;
}
function render(){renderTabs();$('#app').innerHTML=state.tab==='home'?homeView():state.tab==='vocab'?vocabView():state.tab==='gym'?gymView():state.tab==='quiz'?translationView():state.tab==='matching'?matchingView():state.tab==='role'?roleView():state.tab==='fill'?fillView():progressView()}render();
</script></body></html>
