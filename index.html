const FILLS=[{"text": "אני רוצה ___ מים.", "answer": "לשתות", "fr": "Je veux boire de l'eau."}, {"text": "אני אוהבת ___ עברית.", "answer": "ללמוד", "fr": "J'aime apprendre l'hébreu."}, {"text": "היום אני ___ לבית הספר.", "answer": "הולכת", "fr": "Aujourd'hui je vais à l'école."}, {"text": "אני ___ ספר.", "answer": "קוראת", "fr": "Je lis un livre."}, {"text": "אני ___ מחברת.", "answer": "כותבת", "fr": "J'écris dans un cahier."}, {"text": "אני ___ לשאלה.", "answer": "עונה", "fr": "Je réponds à la question."}, {"text": "אני ___ לאמא.", "answer": "עוזרת", "fr": "J'aide maman."}, {"text": "אני ___ שיר.", "answer": "שרה", "fr": "Je chante une chanson."}, {"text": "אני ___ עם חברה.", "answer": "משחקת", "fr": "Je joue avec une amie."}, {"text": "אני ___ את הדלת.", "answer": "פותחת", "fr": "J'ouvre la porte."}];
const state=JSON.parse(localStorage.getItem('salome_app_state')||'{}');state.known=state.known||{};state.gym=state.gym||{round:0,score:0,errors:0,apparatus:0,done:false,history:[]};state.role=state.role||{mission:0,step:0,score:0,done:false};state.fill=state.fill||{index:0,score:0,done:false};state.tab=state.tab||'home';function save(){localStorage.setItem('salome_app_state',JSON.stringify(state))}function $(s){return document.querySelector(s)}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pick(a){return a[Math.floor(Math.random()*a.length)]}function normalize(s){return (s||'').trim().replace(/[?.!,]/g,'').replace(/\s+/g,' ')}const tabs=[['home','Accueil'],['vocab','Verbes'],['gym','Jeu gym'],['role','Jeu de rôle'],['fill','Complète'],['progress','Podium']];function renderTabs(){const root=$('#tabs');root.innerHTML='';tabs.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.className=state.tab===id?'active':'';b.onclick=()=>{state.tab=id;save();render()};root.appendChild(b)})}function homeView(){return `<section class='card'><div class='eyebrow'>Bienvenue</div><div class='title'>L'appli de Salomé est prête 💜</div><p class='muted'>Nuancier violet, gymnastique, écriture en hébreu et verbes de base.</p><div class='row'><span class='pill'>${WORDS.length} verbes</span><span class='pill'>4 agrès</span><span class='pill'>2 jeux de rôle</span><span class='pill'>10 phrases à compléter</span></div></section><section class='card'><div class='eyebrow'>Comment jouer</div><div class='list'><div>🤸‍♀️ <b>Jeu gym</b> : bonne réponse = figure réussie, mauvaise réponse = chute.</div><div>✍️ <b>Jeu de rôle</b> : tu lis la consigne en français et tu écris la phrase en hébreu.</div><div>🧩 <b>Complète</b> : tu complètes la phrase avec le bon mot en hébreu.</div></div></section><section class='card center'><button class='btn' onclick="state.tab='gym';save();render()">Commencer le jeu gym</button></section>`}function markKnownByIndex(i){const w=WORDS[i];state.known[w.he]=!state.known[w.he];save();render()}function vocabView(){return `<section class='card'><div class='eyebrow'>Vocabulaire</div><div class='title'>Les verbes de base</div><p class='muted'>Avec hébreu, phonétique, présent masculin/féminin et passé.</p></section>`+WORDS.map((w,i)=>`<section class='card'><div class='between'><div><div class='he'>${w.he}</div><div class='phon'>${w.ph}</div><div class='fr'>${w.fr}</div></div><button class='btn secondary' onclick='markKnownByIndex(${i})'>${state.known[w.he]?'Je connais déjà ✓':'Je connais déjà'}</button></div><div class='grid2' style='margin-top:12px'><div class='kpi'><b>Masculin</b><div class='he' style='font-size:24px'>${w.male}</div></div><div class='kpi'><b>Féminin</b><div class='he' style='font-size:24px'>${w.female}</div></div><div class='kpi'><b>Passé</b><div class='he' style='font-size:24px'>${w.past}</div></div><div class='kpi'><b>Exemple</b><div class='small'>אני רוצה ${w.he.replace(/[\u0591-\u05C7]/g,'')}</div></div></div></section>`).join('')}const GYM_FIGURES=['La roue au sol','Les barres asymétriques','Le saut de cheval','La poutre'];
const GYM_ROUNDS=10;
let gymBusy=false;
let gymTimer=null;
function ensureGym(){
 const g=state.gym;
 if(g.round===undefined)g.round=0;
 if(g.score===undefined)g.score=0;
 if(g.errors===undefined)g.errors=0;
 if(!Array.isArray(g.history))g.history=[];
 if(g.apparatus===undefined)g.apparatus=0;
 if(!Array.isArray(g.opponents))g.opponents=[6+Math.floor(Math.random()*3),5+Math.floor(Math.random()*4)];
 if(!Array.isArray(g.deck))g.deck=shuffle(WORDS.map((_,i)=>i));
 if(!g.current||!WORDS.some(w=>w.he===g.current.he))g.current=WORDS[g.deck[g.round%g.deck.length]];
 if(!Array.isArray(g.choices))g.choices=shuffle([g.current.fr,...shuffle(WORDS.map(w=>w.fr).filter(fr=>fr!==g.current.fr)).slice(0,3)]);
 save();
}
function resetGym(){
 if(gymTimer)clearTimeout(gymTimer);gymBusy=false;
 state.gym={round:0,score:0,errors:0,apparatus:0,done:false,history:[],opponents:[6+Math.floor(Math.random()*3),5+Math.floor(Math.random()*4)],deck:shuffle(WORDS.map((_,i)=>i)),current:null,choices:null};
 ensureGym();save();render();
}
function gymnastSVG(){return `<svg viewBox="0 0 92 154" role="img" aria-label="Gymnaste en justaucorps violet" xmlns="http://www.w3.org/2000/svg">
<g stroke="#4f3269" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path class="leg-l" d="M40 102 L30 127 L24 144"/><path class="leg-r" d="M52 102 L64 127 L73 144"/>
<path class="arm-l" d="M34 64 L20 80 L8 61"/><path class="arm-r" d="M58 64 L74 80 L83 60"/>
</g><path d="M37 55 Q46 48 55 55 L61 89 L55 108 L37 108 L31 89Z" fill="#7b44d2" stroke="#6335ac" stroke-width="2"/>
<path d="M39 58 L46 68 L53 58" fill="none" stroke="#f4e8ff" stroke-width="3"/><path d="M35 91 L57 91" stroke="#bda0ff" stroke-width="3"/>
<circle cx="46" cy="33" r="22" fill="#f3c4a5"/><path d="M24 32 Q19 9 42 8 Q68 4 69 29 Q63 21 60 18 Q47 25 28 22Z" fill="#3c2639"/>
<circle cx="67" cy="10" r="11" fill="#3c2639"/><circle cx="39" cy="35" r="2" fill="#3d2a37"/><circle cx="54" cy="35" r="2" fill="#3d2a37"/><path d="M40 43 Q46 48 53 43" stroke="#b65f74" fill="none" stroke-width="2" stroke-linecap="round"/>
<path d="M18 7 l3 4 -3 4 -3 -4z" fill="#e2c6ff"/>
</svg>`}
function apparatusSVG(index){
 if(index===0)return `<svg viewBox="0 0 330 250" aria-hidden="true"><rect x="24" y="206" width="282" height="16" rx="7" fill="#c28ff5"/><path d="M24 215 H306" stroke="#f6ddff" stroke-width="2" stroke-dasharray="12 9"/></svg>`;
 if(index===1)return `<svg viewBox="0 0 330 250" aria-hidden="true"><path d="M95 95V213 M235 60V213" stroke="#ad86db" stroke-width="7" stroke-linecap="round"/><path d="M95 95H195 M160 60H235" stroke="#8553ca" stroke-width="8" stroke-linecap="round"/><path d="M95 205L78 222 M235 205L252 222" stroke="#b18add" stroke-width="4"/></svg>`;
 if(index===2)return `<svg viewBox="0 0 330 250" aria-hidden="true"><rect x="174" y="149" width="91" height="28" rx="14" fill="#a673e1"/><path d="M187 177 L187 211 M251 177L251 211" stroke="#8658bb" stroke-width="7"/><rect x="14" y="206" width="138" height="12" rx="3" fill="#b989f0"/></svg>`;
 return `<svg viewBox="0 0 330 250" aria-hidden="true"><path d="M55 187H280" stroke="#9462cf" stroke-width="11" stroke-linecap="round"/><path d="M95 192L77 222 M245 192L262 222" stroke="#b28adb" stroke-width="7" stroke-linecap="round"/></svg>`;
}
function podiumData(){
 const g=state.gym;
 const arr=[{name:'Salomé',score:g.score,emoji:'💜'},{name:'Nina',score:g.opponents[0],emoji:'🩷'},{name:'Emma',score:g.opponents[1],emoji:'🤍'}];
 arr.sort((a,b)=>b.score-a.score||(a.name==='Salomé'?-1:b.name==='Salomé'?1:a.name.localeCompare(b.name)));
 return arr;
}
function advanceGym(){
 gymTimer=null;gymBusy=false;
 const g=state.gym;g.round++;g.apparatus=g.round%4;g.current=null;g.choices=null;
 if(g.round>=GYM_ROUNDS)g.done=true;else ensureGym();
 save();if(state.tab==='gym')render();
}
function answerGym(i){
 if(gymBusy||state.gym.done)return;
 ensureGym();const g=state.gym,answer=g.choices[i];
 if(answer===undefined)return;
 gymBusy=true;const good=answer===g.current.fr;
 g.history.push({word:g.current.he,answer,ok:good});
 if(good)g.score++;else g.errors++;
 save();
 const character=$('#gymnast');const stage=$('#gymstage');const status=$('#gymstatus');
 if(character){character.classList.add(good?'success':'fail');character.classList.add('figure-'+(g.apparatus%4))}
 if(stage){stage.classList.add('action');if(!good)stage.classList.add('failed')}
 if(status){status.className='gym-status '+(good?'win':'lose');status.textContent=good?'BRAVO ! Figure réussie ! 💜':'OUPS ! Figure ratée !'}
 document.querySelectorAll('.gym-actions button').forEach(b=>b.disabled=true);
 gymTimer=setTimeout(advanceGym,1850);
}
function gymView(){
 ensureGym();const g=state.gym;
 if(g.done){
 const p=podiumData(),medals=['🥇','🥈','🥉'];const classes=['first','second','third'];
 return `<section class="card"><div class="eyebrow">Fin de la compétition</div><div class="title">🏆 Podium de gymnastique</div><p class="muted">Résultat après ${GYM_ROUNDS} figures. Les scores des autres gymnastes restent identiques pendant ce match.</p>
 <div class="scoreboard"><div class="kpi"><div class="small">Réussites</div><div class="title">${g.score}</div></div><div class="kpi"><div class="small">Chutes</div><div class="title">${g.errors}</div></div><div class="kpi"><div class="small">Questions</div><div class="title">${GYM_ROUNDS}</div></div></div>
 <div class="podium gym-podium">${p.map((x,i)=>`<div class="step ${classes[i]}"><span class="badge">${medals[i]}</span><strong>${x.emoji} ${x.name}</strong><span>${x.score} pts</span></div>`).join('')}</div>
 <div class="center" style="margin-top:18px"><div class="title">${p[0].name==='Salomé'?'Salomé sur la première marche ! 🎉':'Encore une compétition pour monter sur le podium !'}</div><button class="btn" onclick="resetGym()">Nouvelle compétition 🤸‍♀️</button></div></section>`;
 }
 const index=g.apparatus%4;
 return `<section class="card"><div class="eyebrow">Jeu gym · Compétition</div><div class="title">${GYM_FIGURES[index]}</div><p class="muted">La gymnaste attend debout. Choisis le bon mot : elle réalisera sa figure si tu as juste !</p>
 <div class="scoreboard"><div class="kpi"><div class="small">Question</div><div class="title">${g.round+1}/${GYM_ROUNDS}</div></div><div class="kpi"><div class="small">Réussites</div><div class="title">${g.score}</div></div><div class="kpi"><div class="small">Chutes</div><div class="title">${g.errors}</div></div></div>
 <div id="gymstage" class="gym-stage"><div class="apparatus">${apparatusSVG(index)}</div><div id="gymnast" class="gymnast">${gymnastSVG()}</div><div class="mat"></div></div>
 <div id="gymstatus" class="gym-status">À toi de jouer !</div>
 <div class="he">${g.current.he}</div><p class="muted center">Que signifie ce verbe ?</p><div class="gym-actions">${g.choices.map((x,i)=>`<button class="option" onclick="answerGym(${i})">${x}</button>`).join('')}</div></section>`;
}
function currentRole(){return ROLEPLAYS[state.role.mission]}function submitRole(){const val=normalize($('#roleanswer').value),step=currentRole().steps[state.role.step],good=step.answers.map(normalize).includes(val),box=$('#rolefeedback');if(good){state.role.score++;box.className='success';box.textContent='Bravo ! Bonne réponse.';state.role.step++;$('#roleanswer').value='';if(state.role.step>=currentRole().steps.length)state.role.done=true;save();setTimeout(render,500)}else{box.className='error';box.innerHTML='Pas exactement. Réponse attendue : <b>'+step.answers[0]+'</b>';save()}}function nextMission(){state.role={mission:(state.role.mission+1)%ROLEPLAYS.length,step:0,score:0,done:false};save();render()}function resetRole(){state.role={mission:0,step:0,score:0,done:false};save();render()}function roleView(){const m=currentRole();if(state.role.done)return `<section class='card'><div class='eyebrow'>Mission terminée</div><div class='title'>${m.name}</div><div class='success'>Score : ${state.role.score}/${m.steps.length}</div><div class='row' style='margin-top:14px'><button class='btn' onclick='nextMission()'>Mission suivante</button><button class='btn ghost' onclick='resetRole()'>Recommencer</button></div></section>`;const step=m.steps[state.role.step];return `<section class='card'><div class='eyebrow'>Jeu de rôle écrit</div><div class='title'>${m.name}</div><p class='muted'>Lis la consigne en français, puis écris la réponse en hébreu.</p><div class='kpi'><div class='small'>Étape</div><div class='title'>${state.role.step+1}/${m.steps.length}</div></div><div class='card' style='background:#faf7ff;margin-top:14px'><div class='fr'>${step.fr}</div></div><label for='roleanswer'>Ta réponse en hébreu</label><textarea id='roleanswer' placeholder='Écris ici en hébreu'></textarea><div id='rolefeedback' style='margin-top:10px'></div><div class='row' style='margin-top:12px'><button class='btn' onclick='submitRole()'>Vérifier</button><button class='btn ghost' onclick="document.getElementById('rolefeedback').innerHTML='<div class=notice>Indice : pense à la forme féminine si besoin.</div>'">Indice</button></div></section>`}function submitFill(){const val=normalize($('#fillanswer').value),item=FILLS[state.fill.index],good=normalize(item.answer)===val,box=$('#fillfeedback');if(good){state.fill.score++;state.fill.index++;$('#fillanswer').value='';box.className='success';box.textContent='Bravo !';if(state.fill.index>=FILLS.length)state.fill.done=true;save();setTimeout(render,450)}else{box.className='error';box.innerHTML='Pas encore. Bonne réponse : <b>'+item.answer+'</b>';save()}}function resetFill(){state.fill={index:0,score:0,done:false};save();render()}function fillView(){if(state.fill.done)return `<section class='card'><div class='eyebrow'>Complète la phrase</div><div class='title'>Terminé !</div><div class='success'>Score : ${state.fill.score}/${FILLS.length}</div><div class='center' style='margin-top:14px'><button class='btn' onclick='resetFill()'>Recommencer</button></div></section>`;const item=FILLS[state.fill.index];return `<section class='card'><div class='eyebrow'>Complète la phrase</div><div class='title'>Trouve le bon mot</div><div class='small'>${state.fill.index+1}/${FILLS.length}</div><div class='he' style='margin-top:10px'>${item.text}</div><div class='muted'>${item.fr}</div><label for='fillanswer'>Ta réponse en hébreu</label><input id='fillanswer' placeholder='Écris le mot manquant'><div id='fillfeedback' style='margin-top:10px'></div><div class='row' style='margin-top:12px'><button class='btn' onclick='submitFill()'>Vérifier</button><button class='btn ghost' onclick="document.getElementById('fillfeedback').innerHTML='<div class=notice>Indice : <b>${item.answer}</b></div>'">Indice</button></div></section>`}function progressView(){const knownCount=Object.values(state.known).filter(Boolean).length;return `<section class='card'><div class='eyebrow'>Progression</div><div class='title'>Tes résultats</div><div class='scoreboard'><div class='kpi'><div class='small'>Verbes connus</div><div class='title'>${knownCount}/${WORDS.length}</div></div><div class='kpi'><div class='small'>Gym</div><div class='title'>${state.gym.score} réussites</div></div><div class='kpi'><div class='small'>Écriture</div><div class='title'>${state.role.score} points</div></div></div><div class='notice' style='margin-top:14px'>Quand tu coches “Je connais déjà”, les verbes reviennent moins souvent dans les jeux.</div><div class='center' style='margin-top:14px'><button class='btn ghost' onclick='localStorage.removeItem("salome_app_state"); location.reload();'>Réinitialiser l’application</button></div></section>`}function render(){renderTabs();$('#app').innerHTML=state.tab==='home'?homeView():state.tab==='vocab'?vocabView():state.tab==='gym'?gymView():state.tab==='role'?roleView():state.tab==='fill'?fillView():progressView()}render();
</script></body></html>
