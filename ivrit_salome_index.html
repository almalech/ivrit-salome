solute;left:18px;right:18px;bottom:66px}.vault{width:90px;height:40px;background:#cfb4ff;border-radius:55px 55px 16px 16px;position:absolute;right:26px;bottom:66px;border-bottom:6px solid #9d67e2}.bars .bar1,.bars .bar2{position:absolute;width:6px;background:#a46af0;bottom:70px;border-radius:99px}.bars .bar1{height:110px;left:34%}.bars .bar2{height:140px;left:56%}.bars .line1,.bars .line2{position:absolute;height:6px;background:#d8b8ff;border-radius:99px;left:34%;right:33%}.bars .line1{bottom:175px}.bars .line2{bottom:145px}.girl{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;font-size:74px;transition:all .45s ease}.girl.small{font-size:62px}.girl.fall{transform:translateX(-50%) rotate(90deg);bottom:58px;opacity:.9}.girl.beamok{bottom:92px}.girl.vaultok{right:70px;left:auto;transform:rotate(-18deg)}.girl.barsok{bottom:150px}.girl.floorok{bottom:76px;transform:translateX(-50%) rotate(-18deg)}.scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:14px}.kpi{background:#faf7ff;border:1px solid #eadfff;border-radius:16px;padding:10px}.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:18px}.step{width:30%;max-width:150px;border-radius:16px 16px 0 0;padding:12px 8px;text-align:center;font-weight:800}.first{background:var(--gold);height:160px}.second{background:var(--silver);height:130px}.third{background:var(--bronze);height:110px}.badge{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#fff;margin-bottom:8px;font-size:18px}.list{display:flex;flex-direction:column;gap:10px}.small{font-size:13px;color:var(--muted)}</style></head><body><header><h1>Ivrit avec Salomé 💜</h1><p>Hébreu débutant · Jeux, gym et écriture</p></header><div class="wrap"><nav class="tabs" id="tabs"></nav><main id="app"></main><footer>Version 1 · Application de Salomé · 💜🤸‍♀️</footer></div><script>

const state=JSON.parse(localStorage.getItem('salome_app_state')||'{}');state.known=state.known||{};state.gym=state.gym||{round:0,score:0,errors:0,apparatus:0,done:false,history:[]};state.role=state.role||{mission:0,step:0,score:0,done:false};state.fill=state.fill||{index:0,score:0,done:false};state.tab=state.tab||'home';function save(){localStorage.setItem('salome_app_state',JSON.stringify(state))}function $(s){return document.querySelector(s)}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pick(a){return a[Math.floor(Math.random()*a.length)]}function normalize(s){return (s||'').trim().replace(/[?.!,]/g,'').replace(/\s+/g,' ')}const tabs=[['home','Accueil'],['vocab','Verbes'],['gym','Jeu gym'],['role','Jeu de rôle'],['fill','Complète'],['progress','Podium']];function renderTabs(){const root=$('#tabs');root.innerHTML='';tabs.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.className=state.tab===id?'active':'';b.onclick=()=>{state.tab=id;save();render()};root.appendChild(b)})}function homeView(){return `<section class='card'><div class='eyebrow'>Bienvenue</div><div class='title'>L'appli de Salomé est prête 💜</div><p class='muted'>Nuancier violet, gymnastique, écriture en hébreu et verbes de base.</p><div class='row'><span class='pill'>${WORDS.length} verbes</span><span class='pill'>4 agrès</span><span class='pill'>2 jeux de rôle</span><span class='pill'>10 phrases à compléter</span></div></section><section class='card'><div class='eyebrow'>Comment jouer</div><div class='list'><div>🤸‍♀️ <b>Jeu gym</b> : bonne réponse = figure réussie, mauvaise réponse = chute.</div><div>✍️ <b>Jeu de rôle</b> : tu lis la consigne en français et tu écris la phrase en hébreu.</div><div>🧩 <b>Complète</b> : tu complètes la phrase avec le bon mot en hébreu.</div></div></section><section class='card center'><button class='btn' onclick="state.tab='gym';save();render()">Commencer le jeu gym</button></section>`}function markKnownByIndex(i){const w=WORDS[i];state.known[w.he]=!state.known[w.he];save();render()}function vocabView(){return `<section class='card'><div class='eyebrow'>Vocabulaire</div><div class='title'>Les verbes de base</div><p class='muted'>Avec hébreu, phonétique, présent masculin/féminin et passé.</p></section>`+WORDS.map((w,i)=>`<section class='card'><div class='between'><div><div class='he'>${w.he}</div><div class='phon'>${w.ph}</div><div class='fr'>${w.fr}</div></div><button class='btn secondary' onclick='markKnownByIndex(${i})'>${state.known[w.he]?'Je connais déjà ✓':'Je connais déjà'}</button></div><div class='grid2' style='margin-top:12px'><div class='kpi'><b>Masculin</b><div class='he' style='font-size:24px'>${w.male}</div></div><div class='kpi'><b>Féminin</b><div class='he' style='font-size:24px'>${w.female}</div></div><div class='kpi'><b>Passé</b><div class='he' style='font-size:24px'>${w.past}</div></div><div class='kpi'><b>Exemple</b><div class='small'>אני רוצה ${w.he.replace(/[\u0591-\u05C7]/g,'')}</div></div></div></section>`).join('')}function currentGymWord(){const unseen=WORDS.filter(w=>!state.known[w.he]);const pool=unseen.length?unseen:WORDS;if(!state.gym.current){state.gym.current=pick(pool);save()}return state.gym.current}function gymChoice(correct){const others=shuffle(WORDS.map(w=>w.fr).filter(fr=>fr!==correct.fr)).slice(0,3);return shuffle([correct.fr,...others])}function gymFigureName(){return ['Sol','Poutre','Saut','Barres'][state.gym.apparatus%4]}function gymGirlClass(ok){const a=state.gym.apparatus%4;if(!ok)return 'girl fall';if(a===0)return 'girl floorok';if(a===1)return 'girl beamok';if(a===2)return 'girl vaultok small';return 'girl barsok small'}function answerGym(ans){const cur=state.gym.current;const good=ans===cur.fr;state.gym.history.push({word:cur.he,answer:ans,ok:good});if(good)state.gym.score++;else state.gym.errors++;state.gym.lastOk=good;state.gym.round++;state.gym.apparatus++;state.gym.current=null;if(state.gym.round>=8)state.gym.done=true;save();render()}function resetGym(){state.gym={round:0,score:0,errors:0,apparatus:0,done:false,history:[],current:null,lastOk:null};save();render()}function podiumData(){const sal=state.gym.score;const nina=Math.max(0,Math.min(8,sal+(Math.random()>.5?1:-1)+(Math.random()>.65?1:0)));const emma=Math.max(0,Math.min(8,sal+(Math.random()>.5?0:1)-(Math.random()>.5?1:0)));return [{name:'Salomé',score:sal,emoji:'💜'},{name:'Nina',score:nina,emoji:'🩷'},{name:'Emma',score:emma,emoji:'🤍'}].sort((a,b)=>b.score-a.score)}function gymView(){if(state.gym.done){const pod=podiumData(),pos=['first','second','third'],medals=['🥇','🥈','🥉'];return `<section class='card'><div class='eyebrow'>Résultat final</div><div class='title'>Podium de gymnastique</div><p class='muted'>Chaque bonne réponse = figure réussie. Chaque erreur = chute.</p><div class='scoreboard'><div class='kpi'><div class='eyebrow'>Figures réussies</div><div class='title'>${state.gym.score}</div></div><div class='kpi'><div class='eyebrow'>Chutes</div><div class='title'>${state.gym.errors}</div></div><div class='kpi'><div class='eyebrow'>Tours</div><div class='title'>${state.gym.round}</div></div></div><div class='podium'>${pod.map((p,i)=>`<div class='step ${pos[i]}'><div class='badge'>${medals[i]}</div><div>${p.emoji}</div><div>${p.name}</div><div>${p.score} pts</div></div>`).join('')}</div><div class='center' style='margin-top:18px'><button class='btn' onclick='resetGym()'>Recommencer</button></div></section>`}const w=currentGymWord(),choices=gymChoice(w),a=state.gym.apparatus%4;const msg=state.gym.lastOk===true?`<div class='success'>Bravo ! Figure réussie 💜</div>`:state.gym.lastOk===false?`<div class='error'>Oups… elle tombe. On continue !</div>`:'';return `<section class='card'><div class='eyebrow'>Jeu gym</div><div class='title'>Agrès : ${gymFigureName()}</div><p class='muted'>Choisis la bonne traduction. Si tu réponds bien, Salomé réussit sa figure.</p>${msg}<div class='scoreboard'><div class='kpi'><div class='small'>Tour</div><div class='title'>${state.gym.round+1}/8</div></div><div class='kpi'><div class='small'>Réussites</div><div class='title'>${state.gym.score}</div></div><div class='kpi'><div class='small'>Chutes</div><div class='title'>${state.gym.errors}</div></div></div><div class='gym' style='margin-top:14px'><div class='sky'></div>${a===1?`<div class='beam'></div>`:''}${a===2?`<div class='vault'></div>`:''}${a===3?`<div class='bars'><div class='bar1'></div><div class='bar2'></div><div class='line1'></div><div class='line2'></div></div>`:''}<div class='${gymGirlClass(state.gym.lastOk!==false)}'>🤸‍♀️</div><div class='floor'></div></div><div style='margin-top:16px' class='he'>${w.he}</div><div class='phon'>${w.ph}</div><div style='margin-top:12px'>${choices.map(c=>`<button class='option' onclick=${"answerGym("+JSON.stringify(c)+")"}>${c}</button>`).join('')}</div></section>`}function currentRole(){return ROLEPLAYS[state.role.mission]}function submitRole(){const val=normalize($('#roleanswer').value),step=currentRole().steps[state.role.step],good=step.answers.map(normalize).includes(val),box=$('#rolefeedback');if(good){state.role.score++;box.className='success';box.textContent='Bravo ! Bonne réponse.';state.role.step++;$('#roleanswer').value='';if(state.role.step>=currentRole().steps.length)state.role.done=true;save();setTimeout(render,500)}else{box.className='error';box.innerHTML='Pas exactement. Réponse attendue : <b>'+step.answers[0]+'</b>';save()}}function nextMission(){state.role={mission:(state.role.mission+1)%ROLEPLAYS.length,step:0,score:0,done:false};save();render()}function resetRole(){state.role={mission:0,step:0,score:0,done:false};save();render()}function roleView(){const m=currentRole();if(state.role.done)return `<section class='card'><div class='eyebrow'>Mission terminée</div><div class='title'>${m.name}</div><div class='success'>Score : ${state.role.score}/${m.steps.length}</div><div class='row' style='margin-top:14px'><button class='btn' onclick='nextMission()'>Mission suivante</button><button class='btn ghost' onclick='resetRole()'>Recommencer</button></div></section>`;const step=m.steps[state.role.step];return `<section class='card'><div class='eyebrow'>Jeu de rôle écrit</div><div class='title'>${m.name}</div><p class='muted'>Lis la consigne en français, puis écris la réponse en hébreu.</p><div class='kpi'><div class='small'>Étape</div><div class='title'>${state.role.step+1}/${m.steps.length}</div></div><div class='card' style='background:#faf7ff;margin-top:14px'><div class='fr'>${step.fr}</div></div><label for='roleanswer'>Ta réponse en hébreu</label><textarea id='roleanswer' placeholder='Écris ici en hébreu'></textarea><div id='rolefeedback' style='margin-top:10px'></div><div class='row' style='margin-top:12px'><button class='btn' onclick='submitRole()'>Vérifier</button><button class='btn ghost' onclick="document.getElementById('rolefeedback').innerHTML='<div class=notice>Indice : pense à la forme féminine si besoin.</div>'">Indice</button></div></section>`}function submitFill(){const val=normalize($('#fillanswer').value),item=FILLS[state.fill.index],good=normalize(item.answer)===val,box=$('#fillfeedback');if(good){state.fill.score++;state.fill.index++;$('#fillanswer').value='';box.className='success';box.textContent='Bravo !';if(state.fill.index>=FILLS.length)state.fill.done=true;save();setTimeout(render,450)}else{box.className='error';box.innerHTML='Pas encore. Bonne réponse : <b>'+item.answer+'</b>';save()}}function resetFill(){state.fill={index:0,score:0,done:false};save();render()}function fillView(){if(state.fill.done)return `<section class='card'><div class='eyebrow'>Complète la phrase</div><div class='title'>Terminé !</div><div class='success'>Score : ${state.fill.score}/${FILLS.length}</div><div class='center' style='margin-top:14px'><button class='btn' onclick='resetFill()'>Recommencer</button></div></section>`;const item=FILLS[state.fill.index];return `<section class='card'><div class='eyebrow'>Complète la phrase</div><div class='title'>Trouve le bon mot</div><div class='small'>${state.fill.index+1}/${FILLS.length}</div><div class='he' style='margin-top:10px'>${item.text}</div><div class='muted'>${item.fr}</div><label for='fillanswer'>Ta réponse en hébreu</label><input id='fillanswer' placeholder='Écris le mot manquant'><div id='fillfeedback' style='margin-top:10px'></div><div class='row' style='margin-top:12px'><button class='btn' onclick='submitFill()'>Vérifier</button><button class='btn ghost' onclick="document.getElementById('fillfeedback').innerHTML='<div class=notice>Indice : <b>${item.answer}</b></div>'">Indice</button></div></section>`}function progressView(){const knownCount=Object.values(state.known).filter(Boolean).length;return `<section class='card'><div class='eyebrow'>Progression</div><div class='title'>Tes résultats</div><div class='scoreboard'><div class='kpi'><div class='small'>Verbes connus</div><div class='title'>${knownCount}/${WORDS.length}</div></div><div class='kpi'><div class='small'>Gym</div><div class='title'>${state.gym.score} réussites</div></div><div class='kpi'><div class='small'>Écriture</div><div class='title'>${state.role.score} points</div></div></div><div class='notice' style='margin-top:14px'>Quand tu coches “Je connais déjà”, les verbes reviennent moins souvent dans les jeux.</div><div class='center' style='margin-top:14px'><button class='btn ghost' onclick='localStorage.removeItem("salome_app_state"); location.reload();'>Réinitialiser l’application</button></div></section>`}function render(){renderTabs();$('#app').innerHTML=state.tab==='home'?homeView():state.tab==='vocab'?vocabView():state.tab==='gym'?gymView():state.tab==='role'?roleView():state.tab==='fill'?fillView():progressView()}render();
</script></body></html>
